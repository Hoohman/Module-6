name: database

x-db-password: &db-password ${POSTGRES_PASSWORD:-demo-password}

x-app: &app
  image: ${COMPOSE_PROJECT_NAME}-message-services
  build: .

services:
  db:
    image: postgres:18

    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: *db-password
      POSTGRES_DB: appdb

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

    volumes:
      - pgdata:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped

  receiver:
    <<: *app
    command: ["./receiver"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: appdb
      PGUSER: appuser
      PGPASSWORD: *db-password
      PGCONNECT_TIMEOUT: "3"
      PGOPTIONS: "-c statement_timeout=2000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "true </dev/tcp/127.0.0.1/30303"]
      interval: 5s
      timeout: 2s
      retries: 5

  sender:
    <<: *app
    command: ["./NetworkLogFilter"]
    environment:
      RECEIVER_HOST: receiver
    depends_on:
      receiver:
        condition: service_healthy
    profiles: [demo]

volumes:
  pgdata:
